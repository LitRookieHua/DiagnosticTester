# RX EOL 标定流程（F4CMC-52 D124 弧度转角度验证）
# RID 0xFE01 = EOL 标定（写 Z042/D124）
# 3103 响应 71 03 FE01 <status>：01=Running 02=Success 03=Failure
steps:

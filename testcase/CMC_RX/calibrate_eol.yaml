    request: "1003"
    expect: "5003"
  - name: app 安全解锁
    security_access: app
  - name: 启动 EOL 标定 RID FE01
    request: "3101FE01"
    expect: "7101FE01"
  # 连续读 28 次标定状态，间隔 1s，覆盖 EOL 标定 28s 超时窗口
  - name: 标定状态 01

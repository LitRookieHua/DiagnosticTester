steps:
  - name: 进扩展会话
    request: "1003"
    expect: "5003"
  - name: 解锁 app
    security_access: app
  - name: 读 DID 9D01（写前）
    request: "229D01"
    expect: "629D01"
  - name: 写 DID 9D01 = 01
    request: "2E9D0101"
    expect: "6E9D01"
  - name: 读 DID 9D01（写后回读）
    request: "229D01"
    expect: "629D01"

on_fail: abort

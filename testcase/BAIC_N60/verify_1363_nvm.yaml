timing:
  p2star_ms: 8000

steps:
  # ===== IDC310BAIC-1363: 22 读本地 NVM / 2E 写 NVM+IPC =====
  - name: 默认会话读 9D01（本地 NVM，应立即回 62 不再有 0x78 超时）
    request: "229D01"
    expect: "629D01"
  - name: 默认会话写 9D01（应被拒）
    request: "2E9D0101"
    expect: "7F2E"
  - name: 进扩展会话
    request: "1003"
    expect: "5003"
  - name: 扩展会话锁定态写 9D01（应被拒 33）
    request: "2E9D0101"
    expect: "7F2E"
  - name: 解锁 app（2701）
    security_access: app
  - name: 写 9D01 = 00（先写 NVM 再 IPC 透传；A 核无应答则 7F2E22 但 NVM 已写入）
    request: "2E9D0100"
    expect: "6E9D01"
  - name: 读 9D01 回读（验证 NVM 持久化 = 00）
    request: "229D01"
    expect: "629D0100"
  - name: 写 9D01 = 01（恢复使能）
    request: "2E9D0101"
    expect: "6E9D01"
  - name: 读 9D01 回读（= 01）
    request: "229D01"
    expect: "629D0101"
  - name: 写 9D01 = 02 非法值（应拒 31，NVM 不变）
    request: "2E9D0102"
    expect: "7F2E31"
  - name: 读 9D01（仍 = 01，非法值未入 NVM）
    request: "229D01"
    expect: "629D0101"
  - name: 回默认会话
    request: "1001"
    expect: "5001"
    delay_after_ms: 500

on_fail: continue

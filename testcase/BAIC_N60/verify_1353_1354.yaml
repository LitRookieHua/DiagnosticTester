steps:
  # ===== IDC310BAIC-1353: DID 9D01 =====
  - name: 默认会话读 9D01（全会话允许）
    request: "229D01"
    expect: "629D01"
  - name: 默认会话写 9D01（应被拒）
    request: "2E9D0101"
    expect: "7F2E"
  - name: 进扩展会话
    request: "1003"
    expect: "5003"
  - name: 扩展会话锁定态写 9D01（应被拒 33）
    request: "2E9D0101"
    expect: "7F2E"
  - name: 解锁 app（2701）
    security_access: app
  - name: 读 9D01（写前，经 IPC 0x2238）
    request: "229D01"
    expect: "629D01"
  - name: 写 9D01 = 01（经 IPC 0x2E0A 透传）
    request: "2E9D0101"
    expect: "6E9D01"
  - name: 写 9D01 = 02 非法值（应拒 31）
    request: "2E9D0102"
    expect: "7F2E31"
  - name: 写 9D01 = 00（禁用）
    request: "2E9D0100"
    expect: "6E9D01"
  - name: 读 9D01（写后回读）
    request: "229D01"
    expect: "629D01"
  # ===== IDC310BAIC-1353: RID FF04 空操作 =====
  - name: RID FF04 空操作立即成功
    request: "3101FF0401"
    expect: "7101FF04"
  # ===== IDC310BAIC-1354: RID 2013 带 SN 透传 =====
  - name: RID 2013 透传 A 核（SN 拼入 payload，响应 2048B）
    request: "31012013"
    expect: "71012013"
    timeout_ms: 6000
  # ===== 编程会话读 9D01（全会话允许） =====
  - name: 进编程会话
    request: "1002"
    expect: "5002"
  - name: 编程会话读 9D01
    request: "229D01"
    expect: "629D01"
  - name: 回默认会话
    request: "1001"
    expect: "5001"
    delay_after_ms: 500

on_fail: continue

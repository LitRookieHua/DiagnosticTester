# ===== D1CYC-1480: T1LFL1 修复 31 01 2C F5 清除配置字后 DID 2A1E 未回 0124 =====
# 验证流程：进扩展会话 → 解锁 develop（27 61/62 → 安全等级49）→
#   写脏数据（2E 2A1E，首 2 字节 = FFFF，其余清零，200B）→ 读确认已写脏 →
#   执行例程 31 01 2C F5（清除 InternalCoding / VehicleConfig）→
#   读 DID 2A1E（InternalCoding，200B）首 2 字节应为 24 01（0x0124 = VEH_Chery_T1L）
# 说明：先写脏再清除，才能证明 31 01 2C F5 确实生效（而非初值本就是 0124）。
#   注意：0x2CF5 是清除例程 ID（经 0x31 调用），不是可写 DID；
#   可写配置字是 DID 0x2A1E（InternalCoding），故脏数据走 2E 2A1E。
#
# 物理寻址：请求 0x766，响应 0x776（CAN FD，11 位标准帧）
#   探针实测：FD 帧发送到 0x766，ECU 在 0x776 回复（标准 11 位 FD 帧）。
#   功能寻址 0x7DF 备用。
steps:
  - name: 进扩展会话
    request: "1003"
    expect: "5003"
  - name: 解锁 develop（27 61/62 → 安全等级49）
    security_access: develop
  - name: 写脏数据（2E 2A1E 首2字节=FFFF 其余清零，200B）
    request: ""
    expect: "6E2A1E"
    timeout_ms: 3000
  - name: 读 DID 2A1E 确认已写脏 = FFFF
    request: "222A1E"
    expect: "622A1EFFFF"
    timeout_ms: 3000
  - name: 执行例程 2CF5 清除配置字
    request: "31012CF5"
    expect: "71012CF5"
    timeout_ms: 2000
  - name: 读 DID 2A1E 验证车型配置 = 0124
    request: "222A1E"
    expect: "622A1E2401"
    timeout_ms: 3000
  - name: 回默认会话
    request: "1001"
    expect: "5001"
    delay_after_ms: 500

on_fail: abort

can:
  device: USBCANFD-200U
  channel: 0
  fd: true
  baudrate: 500000
  data_baudrate: 2000000

diagnostic:
  request_id: 0x70C
  response_id: 0x78C

timing:
  p2_ms: 50
  p2star_ms: 8000
  step_delay_ms: 100

steps:
  # ===== 实验：写 01 失败(22)后镜像到底是什么 =====
  - name: 默认会话读 9D01（当前值）
    request: "229D01"
    expect: "629D01"
  - name: 进扩展会话
    request: "1003"
    expect: "5003"
  - name: 解锁 app（2701）
    security_access: app
  - name: 读 9D01（扩展会话，基线）
    request: "229D01"
    expect: "629D01"
  - name: 写 9D01 = 01（A 核可能不应答 → 22）
    request: "2E9D0101"
    expect: "7F2E"
  - name: 写失败后立即读 9D01（01=镜像已写入被回滚？00=写未生效）
    request: "229D01"
    expect: "629D01"
  - name: 写 9D01 = 00
    request: "2E9D0100"
    expect: "6E9D01"
  - name: 写 00 后读 9D01
    request: "229D01"
    expect: "629D01"
  - name: 再写 9D01 = 01（第二次尝试）
    request: "2E9D0101"
    expect: "7F2E"
  - name: 再读 9D01
    request: "229D01"
    expect: "629D01"
  - name: 回默认会话
    request: "1001"
    expect: "5001"
    delay_after_ms: 500

on_fail: continue
